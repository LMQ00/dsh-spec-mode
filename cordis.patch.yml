# Bundle patch for dsh-spec-mode.
#
# One Host row. It declares no Config: the interview protocol, the `.spec`
# product paths, and the AGENTS.md advisory budget are code-owned constants in
# the modules. Everything else it needs (tools, systemPrompt,
# sessionProjections, commands, userQuestions, planMode) is an injected or
# opportunistically read Service from the surrounding composition.
- insert:
    - id: spec-mode
      name: 'dsh-spec-mode'
